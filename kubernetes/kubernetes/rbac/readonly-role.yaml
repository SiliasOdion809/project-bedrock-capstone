apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: retail-app
  name: retail-app-readonly

rules:
- apiGroups: [""]
  resources:
    - pods
    - services
    - configmaps
    - secrets
  verbs:
    - get
    - list
    - watch

- apiGroups: ["apps"]
  resources:
    - deployments
    - replicasets
  verbs:
    - get
    - list
    - watch

- apiGroups: ["networking.k8s.io"]
  resources:
    - ingresses
  verbs:
    - get
    - list
    - watch