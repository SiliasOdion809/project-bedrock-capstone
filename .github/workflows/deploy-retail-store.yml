name: Deploy Retail Store

on:
  workflow_run:
    workflows: ["Terraform Apply"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug Repository Structure
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository root contents:"
          ls -la

          echo ""
          echo "Searching for retail-store-sample-app:"
          find . -type d | grep retail-store    

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
          --region us-east-1 \
          --name project-bedrock-cluster

      - name: Verify Cluster
        run: |
          kubectl get nodes

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Check Helm Version
        run: |
          helm version

      - name: Check Helm Plugins Before Install
        run: |
          helm version
          helm plugin list

      - name: Install Helm Diff Plugin
        run: |
          helm plugin install https://github.com/databus23/helm-diff --version v3.9.12

      - name: Verify Helm Plugin
        run: |
          helm plugin list

      - name: Install Helmfile
        run: |
          HELMFILE_VERSION=v0.170.1

          curl -Lo helmfile.tar.gz \
          https://github.com/helmfile/helmfile/releases/download/${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION#v}_linux_amd64.tar.gz

          tar -xzf helmfile.tar.gz

          chmod +x helmfile

          sudo mv helmfile /usr/local/bin/

          helmfile --version

      - name: Verify Retail Store Files
        run: |
          pwd
          echo "Checking Retail Store directory..."
          ls -la retail-store-sample-app
          ls -la retail-store-sample-app/src
          ls -la retail-store-sample-app/src/app

      - name: Verify Helmfile
        working-directory: retail-store-sample-app/src/app
        run: |
          helmfile --version
          test -f helmfile.yaml
          echo "helmfile.yaml found"

      - name: Deploy Retail Store
        working-directory: retail-store-sample-app/src/app
        env:
          INGRESS: "true"
        run: |
          helmfile --log-level debug apply

      - name: Wait For Deployments
        run: |
          kubectl get deployments
          kubectl rollout status deployment/catalog --timeout=10m || true
          kubectl rollout status deployment/carts --timeout=10m || true
          kubectl rollout status deployment/orders --timeout=10m || true
          kubectl rollout status deployment/checkout --timeout=10m || true
          kubectl rollout status deployment/ui --timeout=10m || true

      - name: Show Pod Details
        run: |
          kubectl get pods -o wide
          kubectl get deployments
          kubectl get svc
          kubectl get ingress

      - name: Investigate Deployment State
        run: |
          echo "=== Namespaces ==="
          kubectl get ns

          echo "=== Deployments ==="
          kubectl get deployments -A

          echo "=== Pods ==="
          kubectl get pods -A

          echo "=== Services ==="
          kubectl get svc -A

          echo "=== Ingresses ==="
          kubectl get ingress -A

          echo "=== Events ==="
          kubectl get events -A --sort-by=.lastTimestamp | tail -50

      - name: Verify Ingress
        run: |
          kubectl get ingress ui -o wide
          kubectl describe ingress ui   

      - name: Get ALB DNS
        run: |
          echo "Waiting for ALB provisioning..."

          for i in {1..30}; do

            kubectl get ingress

            ALB_DNS=$(kubectl get ingress ui \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)

            if [ -n "$ALB_DNS" ]; then
              echo ""
              echo "===================================="
              echo "Retail Store URL:"
              echo "http://${ALB_DNS}"
              echo "===================================="
              exit 0
            fi

            echo "ALB not ready yet... retrying in 20 seconds"
            sleep 20
          done

          echo "ERROR: ALB hostname was not assigned"
          kubectl describe ingress ui
          exit 1
